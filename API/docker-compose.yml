services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: universal-ci-debugger-api:local
    container_name: ci-debugger-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATASET_WORKER_IMAGE: ci-debugger-bugsinpy:local
      DATASET_OUTPUT_DIR: /app/dataset/cases
    volumes:
      - ./dataset/cases:/app/dataset/cases
      # Powerful host-Docker access; local development only.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
